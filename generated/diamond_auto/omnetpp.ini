[General]
network = diamond_auto.ScenarioNetwork
sim-time-limit = 0.02s
cmdenv-express-mode = true
record-eventlog = false
**.scalar-recording = true
**.vector-recording = true
seed-set = 0

*.profileSwitcher.enabled = false
*.scenarioRecoveryController.enabled = true
*.scenarioRecoveryController.scenario = readJSON("scenario.json")
*.scenarioRecoveryController.portMap = readJSON("port_map.json")
*.scenarioRecoveryController.profile0 = readJSON("profiles/profile0.json")
*.scenarioRecoveryController.offlineProfileStore = readJSON("profiles/profile0.json")
*.scenarioRecoveryController.exactProfileStore = readJSON("profiles/profile0.json")
*.packetIdentityRecorder.enabled = true

*.s1.eth[0].bitrate = 100000000bps
*.s2.eth[0].bitrate = 100000000bps
*.s1.eth[1].bitrate = 100000000bps
*.s3.eth[0].bitrate = 100000000bps
*.s2.eth[1].bitrate = 100000000bps
*.s4.eth[0].bitrate = 100000000bps
*.s3.eth[1].bitrate = 100000000bps
*.s4.eth[1].bitrate = 100000000bps
*.s4.eth[2].bitrate = 100000000bps
*.destination.eth[0].bitrate = 100000000bps
*.source.eth[0].bitrate = 100000000bps
*.s1.eth[2].bitrate = 100000000bps

*.destination.numApps = 2
*.destination.app[0].typename = "UdpSinkApp"
*.destination.app[0].display-name = "BE"
*.destination.app[0].io.localPort = 11000
*.destination.app[1].typename = "UdpSinkApp"
*.destination.app[1].display-name = "TT"
*.destination.app[1].io.localPort = 11001

*.source.numApps = 2
*.source.app[0].typename = "UdpSourceApp"
*.source.app[0].display-name = "BE"
*.source.app[0].io.destAddress = "destination"
*.source.app[0].io.destPort = 11000
*.source.app[0].source.packetLength = 1400B
*.source.app[0].source.productionInterval = 0.0002s
*.source.app[0].source.initialProductionOffset = 0s
*.source.app[0].source.packetNameFormat = "BE-%c"
*.source.app[0].source.packetRepresentation = "applicationPacket"
*.source.app[1].typename = "UdpSourceApp"
*.source.app[1].display-name = "TT"
*.source.app[1].io.destAddress = "destination"
*.source.app[1].io.destPort = 11001
*.source.app[1].source.packetLength = 200B
*.source.app[1].source.productionInterval = 0.001s
*.source.app[1].source.initialProductionOffset = 0s
*.source.app[1].source.packetNameFormat = "TT-%c"
*.source.app[1].source.packetRepresentation = "applicationPacket"
*.source.hasOutgoingStreams = true
*.source.bridging.streamIdentifier.identifier.mapping = [{stream: "BE", packetFilter: expr(udp.destPort == 11000)}, {stream: "TT", packetFilter: expr(udp.destPort == 11001)}]
*.source.bridging.streamCoder.encoder.mapping = [{stream: "BE", pcp: 0}, {stream: "TT", pcp: 4}]

*.s1.hasEgressTrafficShaping = true
*.s1.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
*.s1.eth[*].macLayer.queue.numTrafficClasses = 2
*.s1.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = true
*.s1.eth[*].macLayer.queue.transmissionGate[0].durations = [0.0005s, 0.0005s]
*.s1.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.s1.eth[*].macLayer.queue.transmissionGate[1].durations = [0.0005s, 0.0005s]
*.s2.hasEgressTrafficShaping = true
*.s2.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
*.s2.eth[*].macLayer.queue.numTrafficClasses = 2
*.s2.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = true
*.s2.eth[*].macLayer.queue.transmissionGate[0].durations = [0.0005s, 0.0005s]
*.s2.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.s2.eth[*].macLayer.queue.transmissionGate[1].durations = [0.0005s, 0.0005s]
*.s3.hasEgressTrafficShaping = true
*.s3.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
*.s3.eth[*].macLayer.queue.numTrafficClasses = 2
*.s3.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = true
*.s3.eth[*].macLayer.queue.transmissionGate[0].durations = [0.0005s, 0.0005s]
*.s3.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.s3.eth[*].macLayer.queue.transmissionGate[1].durations = [0.0005s, 0.0005s]
*.s4.hasEgressTrafficShaping = true
*.s4.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
*.s4.eth[*].macLayer.queue.numTrafficClasses = 2
*.s4.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = true
*.s4.eth[*].macLayer.queue.transmissionGate[0].durations = [0.0005s, 0.0005s]
*.s4.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.s4.eth[*].macLayer.queue.transmissionGate[1].durations = [0.0005s, 0.0005s]

*.packetIdentityRecorder.flowIds = "TT BE"
*.packetIdentityRecorder.sourceModules = "source.app[1].io source.app[0].io"
*.packetIdentityRecorder.destinationModules = "destination.app[1].io destination.app[0].io"

[Config ScenarioPrecompute]
*.scenarioManager.script = xml("<scenario/>")
*.scenarioRecoveryController.mode = "precompute"
*.scenarioRecoveryController.profileOutputPath = "profiles/profile0.json"
*.scenarioRecoveryController.faultAnalysisOutputPath = "fault_analysis.json"

[Config ScenarioPerFailurePrecompute]
sim-time-limit = 0s
*.packetIdentityRecorder.enabled = false
*.scenarioRecoveryController.mode = "precompute-per-failure"
*.scenarioRecoveryController.perFailureProfileDirectory = "profiles/per_failure/raw"
*.scenarioRecoveryController.perFailureReportOutputPath = "profiles/per_failure/precompute_report.json"

[Config ScenarioExactGroupPrecompute]
sim-time-limit = 0s
*.packetIdentityRecorder.enabled = false
*.scenarioRecoveryController.mode = "precompute-exact-group"
*.scenarioRecoveryController.exactProfileOutputPath = "profiles/exact_equivalence/raw/profile.raw.json"
*.scenarioRecoveryController.exactReportOutputPath = "profiles/exact_equivalence/raw/report.json"

[Config NoRecovery_l_s1_s2]
*.scenarioManager.script = xml("<scenario><set-channel-param t='0.005s' src-module='s1' src-gate='ethg$o[0]' par='disabled' value='true'/><set-channel-param t='0.005s' src-module='s2' src-gate='ethg$o[0]' par='disabled' value='true'/></scenario>")
*.scenarioRecoveryController.mode = "no-recovery"
*.scenarioRecoveryController.faultId = "l_s1_s2"
*.scenarioRecoveryController.recoveryProfileOutputPath = "profiles/no-recovery_l_s1_s2.json"

[Config Online_l_s1_s2]
*.scenarioManager.script = xml("<scenario><set-channel-param t='0.005s' src-module='s1' src-gate='ethg$o[0]' par='disabled' value='true'/><set-channel-param t='0.005s' src-module='s2' src-gate='ethg$o[0]' par='disabled' value='true'/></scenario>")
*.scenarioRecoveryController.mode = "online"
*.scenarioRecoveryController.faultId = "l_s1_s2"
*.scenarioRecoveryController.recoveryProfileOutputPath = "profiles/online_l_s1_s2.json"

[Config Offline_l_s1_s2]
*.scenarioManager.script = xml("<scenario><set-channel-param t='0.005s' src-module='s1' src-gate='ethg$o[0]' par='disabled' value='true'/><set-channel-param t='0.005s' src-module='s2' src-gate='ethg$o[0]' par='disabled' value='true'/></scenario>")
*.scenarioRecoveryController.mode = "offline-per-failure"
*.scenarioRecoveryController.faultId = "l_s1_s2"
*.scenarioRecoveryController.offlineProfileStore = readJSON("profiles/per_failure/runtime_store.json")
*.scenarioRecoveryController.solverConfigHash = "a9718b8f04099937cf100a09ce154940f061a645bcc496f72c7c70e04aee73d0"
*.scenarioRecoveryController.offlineLookupDelay = 0us

