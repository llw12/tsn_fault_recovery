[General]
network = stream_aware_micro.ScenarioNetwork
sim-time-limit = 0.005s
cmdenv-express-mode = true
record-eventlog = false
**.scalar-recording = true
**.vector-recording = true
seed-set = 13

*.profileSwitcher.enabled = false
*.scenarioRecoveryController.enabled = true
*.scenarioRecoveryController.scenario = readJSON("scenario.json")
*.scenarioRecoveryController.portMap = readJSON("port_map.json")
*.scenarioRecoveryController.profile0 = readJSON("profiles/profile0.json")
*.scenarioRecoveryController.offlineProfileStore = readJSON("profiles/profile0.json")
*.scenarioRecoveryController.exactProfileStore = readJSON("profiles/profile0.json")
*.packetIdentityRecorder.enabled = true

*.sA.eth[0].bitrate = 1000000000bps
*.sD.eth[0].bitrate = 1000000000bps
*.sB.eth[0].bitrate = 1000000000bps
*.sD.eth[1].bitrate = 1000000000bps
*.sD.eth[2].bitrate = 1000000000bps
*.destination.eth[0].bitrate = 1000000000bps
*.s0.eth[0].bitrate = 1000000000bps
*.sA.eth[1].bitrate = 1000000000bps
*.s0.eth[1].bitrate = 1000000000bps
*.sB.eth[1].bitrate = 1000000000bps
*.source1.eth[0].bitrate = 1000000000bps
*.s0.eth[2].bitrate = 1000000000bps
*.source2.eth[0].bitrate = 1000000000bps
*.s0.eth[3].bitrate = 1000000000bps

*.destination.numApps = 3
*.destination.app[0].typename = "UdpSinkApp"
*.destination.app[0].display-name = "BE"
*.destination.app[0].io.localPort = 11000
*.destination.app[1].typename = "UdpSinkApp"
*.destination.app[1].display-name = "TT1"
*.destination.app[1].io.localPort = 11001
*.destination.app[2].typename = "UdpSinkApp"
*.destination.app[2].display-name = "TT2"
*.destination.app[2].io.localPort = 11002
*.destination.hasIncomingStreams = true
*.destination.bridging.streamCoder.decoder.mapping = [{vlan: 1, stream: "TT1"}, {vlan: 2, stream: "TT2"}]

*.source1.numApps = 2
*.source1.app[0].typename = "UdpSourceApp"
*.source1.app[0].display-name = "BE"
*.source1.app[0].io.destAddress = "destination"
*.source1.app[0].io.destPort = 11000
*.source1.app[0].source.packetLength = 400B
*.source1.app[0].source.productionInterval = 0.0005s
*.source1.app[0].source.initialProductionOffset = 5e-05s
*.source1.app[0].source.packetNameFormat = "BE-%c"
*.source1.app[0].source.packetRepresentation = "applicationPacket"
*.source1.app[1].typename = "UdpSourceApp"
*.source1.app[1].display-name = "TT1"
*.source1.app[1].io.destAddress = "destination"
*.source1.app[1].io.destPort = 11001
*.source1.app[1].source.packetLength = 200B
*.source1.app[1].source.productionInterval = 0.001s
*.source1.app[1].source.initialProductionOffset = 0.0001s
*.source1.app[1].source.packetNameFormat = "TT1-%c"
*.source1.app[1].source.packetRepresentation = "applicationPacket"
*.source1.hasOutgoingStreams = true
*.source1.bridging.streamIdentifier.identifier.mapping = [{stream: "BE", packetFilter: expr(udp.destPort == 11000)}, {stream: "TT1", packetFilter: expr(udp.destPort == 11001)}]
*.source1.bridging.streamCoder.encoder.mapping = [{stream: "BE", pcp: 0}, {stream: "TT1", pcp: 4, vlan: 1}]

*.source2.numApps = 1
*.source2.app[0].typename = "UdpSourceApp"
*.source2.app[0].display-name = "TT2"
*.source2.app[0].io.destAddress = "destination"
*.source2.app[0].io.destPort = 11002
*.source2.app[0].source.packetLength = 200B
*.source2.app[0].source.productionInterval = 0.001s
*.source2.app[0].source.initialProductionOffset = 0.0003s
*.source2.app[0].source.packetNameFormat = "TT2-%c"
*.source2.app[0].source.packetRepresentation = "applicationPacket"
*.source2.hasOutgoingStreams = true
*.source2.bridging.streamIdentifier.identifier.mapping = [{stream: "TT2", packetFilter: expr(udp.destPort == 11002)}]
*.source2.bridging.streamCoder.encoder.mapping = [{stream: "TT2", pcp: 4, vlan: 2}]

*.s0.hasIncomingStreams = true
*.s0.hasOutgoingStreams = true
*.s0.bridging.streamCoder.decoder.mapping = [{vlan: 1, stream: "TT1"}, {vlan: 2, stream: "TT2"}]
*.s0.bridging.streamCoder.encoder.mapping = [{stream: "TT1", vlan: 1}, {stream: "TT2", vlan: 2}]
*.s0.hasEgressTrafficShaping = true
*.s0.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
*.s0.eth[*].macLayer.queue.numTrafficClasses = 2
*.s0.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = true
*.s0.eth[*].macLayer.queue.transmissionGate[0].durations = [0.0005s, 0.0005s]
*.s0.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.s0.eth[*].macLayer.queue.transmissionGate[1].durations = [0.0005s, 0.0005s]
*.sA.hasIncomingStreams = true
*.sA.hasOutgoingStreams = true
*.sA.bridging.streamCoder.decoder.mapping = [{vlan: 1, stream: "TT1"}, {vlan: 2, stream: "TT2"}]
*.sA.bridging.streamCoder.encoder.mapping = [{stream: "TT1", vlan: 1}, {stream: "TT2", vlan: 2}]
*.sA.hasEgressTrafficShaping = true
*.sA.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
*.sA.eth[*].macLayer.queue.numTrafficClasses = 2
*.sA.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = true
*.sA.eth[*].macLayer.queue.transmissionGate[0].durations = [0.0005s, 0.0005s]
*.sA.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.sA.eth[*].macLayer.queue.transmissionGate[1].durations = [0.0005s, 0.0005s]
*.sB.hasIncomingStreams = true
*.sB.hasOutgoingStreams = true
*.sB.bridging.streamCoder.decoder.mapping = [{vlan: 1, stream: "TT1"}, {vlan: 2, stream: "TT2"}]
*.sB.bridging.streamCoder.encoder.mapping = [{stream: "TT1", vlan: 1}, {stream: "TT2", vlan: 2}]
*.sB.hasEgressTrafficShaping = true
*.sB.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
*.sB.eth[*].macLayer.queue.numTrafficClasses = 2
*.sB.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = true
*.sB.eth[*].macLayer.queue.transmissionGate[0].durations = [0.0005s, 0.0005s]
*.sB.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.sB.eth[*].macLayer.queue.transmissionGate[1].durations = [0.0005s, 0.0005s]
*.sD.hasIncomingStreams = true
*.sD.hasOutgoingStreams = true
*.sD.bridging.streamCoder.decoder.mapping = [{vlan: 1, stream: "TT1"}, {vlan: 2, stream: "TT2"}]
*.sD.bridging.streamCoder.encoder.mapping = [{stream: "TT1", vlan: 1}, {stream: "TT2", vlan: 2}]
*.sD.hasEgressTrafficShaping = true
*.sD.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]
*.sD.eth[*].macLayer.queue.numTrafficClasses = 2
*.sD.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = true
*.sD.eth[*].macLayer.queue.transmissionGate[0].durations = [0.0005s, 0.0005s]
*.sD.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = false
*.sD.eth[*].macLayer.queue.transmissionGate[1].durations = [0.0005s, 0.0005s]

*.packetIdentityRecorder.flowIds = "TT1 TT2 BE"
*.streamForwardingRecorder.enabled = true
*.streamForwardingRecorder.switches = "s0 sA sB sD"
*.streamForwardingRecorder.flowIds = "TT1 TT2"
*.streamForwardingRecorder.streamHandles = "1 2"
*.packetIdentityRecorder.sourceModules = "source1.app[1].io source2.app[0].io source1.app[0].io"
*.packetIdentityRecorder.destinationModules = "destination.app[1].io destination.app[2].io destination.app[0].io"

[Config ScenarioPrecompute]
*.scenarioManager.script = xml("<scenario/>")
*.scenarioRecoveryController.mode = "precompute"
*.scenarioRecoveryController.profileOutputPath = "profiles/profile0.json"
*.scenarioRecoveryController.faultAnalysisOutputPath = "fault_analysis.json"

[Config ScenarioPerFailurePrecompute]
sim-time-limit = 0s
*.packetIdentityRecorder.enabled = false
*.scenarioRecoveryController.mode = "precompute-per-failure"
*.scenarioRecoveryController.perFailureProfileDirectory = "profiles/per_failure/raw"
*.scenarioRecoveryController.perFailureReportOutputPath = "profiles/per_failure/precompute_report.json"

[Config ScenarioExactGroupPrecompute]
sim-time-limit = 0s
*.packetIdentityRecorder.enabled = false
*.scenarioRecoveryController.mode = "precompute-exact-group"
*.scenarioRecoveryController.exactProfileOutputPath = "profiles/exact_equivalence/raw/profile.raw.json"
*.scenarioRecoveryController.exactReportOutputPath = "profiles/exact_equivalence/raw/report.json"

[Config NoRecovery_l_s0_a]
*.scenarioManager.script = xml("<scenario><set-channel-param t='0.004s' src-module='s0' src-gate='ethg$o[0]' par='disabled' value='true'/><set-channel-param t='0.004s' src-module='sA' src-gate='ethg$o[1]' par='disabled' value='true'/></scenario>")
*.scenarioRecoveryController.mode = "no-recovery"
*.scenarioRecoveryController.faultId = "l_s0_a"
*.scenarioRecoveryController.recoveryProfileOutputPath = "profiles/no-recovery_l_s0_a.json"

[Config Online_l_s0_a]
*.scenarioManager.script = xml("<scenario><set-channel-param t='0.004s' src-module='s0' src-gate='ethg$o[0]' par='disabled' value='true'/><set-channel-param t='0.004s' src-module='sA' src-gate='ethg$o[1]' par='disabled' value='true'/></scenario>")
*.scenarioRecoveryController.mode = "online"
*.scenarioRecoveryController.faultId = "l_s0_a"
*.scenarioRecoveryController.recoveryProfileOutputPath = "profiles/online_l_s0_a.json"

[Config Offline_l_s0_a]
*.scenarioManager.script = xml("<scenario><set-channel-param t='0.004s' src-module='s0' src-gate='ethg$o[0]' par='disabled' value='true'/><set-channel-param t='0.004s' src-module='sA' src-gate='ethg$o[1]' par='disabled' value='true'/></scenario>")
*.scenarioRecoveryController.mode = "offline-per-failure"
*.scenarioRecoveryController.faultId = "l_s0_a"
*.scenarioRecoveryController.offlineProfileStore = readJSON("profiles/per_failure/runtime_store.json")
*.scenarioRecoveryController.solverConfigHash = "b03b89e0552cc2a392ca8e35611665be4ebdd390fb5dc552990f480a50456bda"
*.scenarioRecoveryController.offlineLookupDelay = 0us

[Config Exact_l_s0_a]
*.scenarioManager.script = xml("<scenario><set-channel-param t='0.004s' src-module='s0' src-gate='ethg$o[0]' par='disabled' value='true'/><set-channel-param t='0.004s' src-module='sA' src-gate='ethg$o[1]' par='disabled' value='true'/></scenario>")
*.scenarioRecoveryController.mode = "offline-exact-equivalence"
*.scenarioRecoveryController.faultId = "l_s0_a"
*.scenarioRecoveryController.exactProfileStore = readJSON("profiles/exact_equivalence/runtime_store.json")
*.scenarioRecoveryController.solverConfigHash = "b03b89e0552cc2a392ca8e35611665be4ebdd390fb5dc552990f480a50456bda"
*.scenarioRecoveryController.offlineLookupDelay = 0us

[Config Approx_l_s0_a]
*.scenarioManager.script = xml("<scenario><set-channel-param t='0.004s' src-module='s0' src-gate='ethg$o[0]' par='disabled' value='true'/><set-channel-param t='0.004s' src-module='sA' src-gate='ethg$o[1]' par='disabled' value='true'/></scenario>")
*.scenarioRecoveryController.mode = "offline-approx-equivalence"
*.scenarioRecoveryController.faultId = "l_s0_a"
*.scenarioRecoveryController.solverConfigHash = "b03b89e0552cc2a392ca8e35611665be4ebdd390fb5dc552990f480a50456bda"
*.scenarioRecoveryController.offlineLookupDelay = 0us
