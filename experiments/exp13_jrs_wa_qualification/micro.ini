[Config StreamAwareMicro]
description = "Same destination, two VID-backed stream handles, divergent s0 egress"
*.scenarioManager.script = xml("<scenario/>")
*.scenarioRecoveryController.enabled = false
*.streamForwardingRecorder.enabled = true
*.streamForwardingRecorder.outputPath = "/tmp/exp13_stream_forwarding_micro.csv"
*.profileSwitcher.enabled = true
*.profileSwitcher.switchTime = 0s
*.profileSwitcher.profileId = "stream-aware-micro"
*.profileSwitcher.forwardingModel = "stream-aware"
*.profileSwitcher.destinationPath = "destination"
*.profileSwitcher.profileRouteSwitches = "s0 sA sD s0 sB sD"
*.profileSwitcher.profileRouteInterfaces = "eth0 eth0 eth2 eth1 eth0 eth2"
*.profileSwitcher.profileRouteFlowIds = "TT1 TT1 TT1 TT2 TT2 TT2"
*.profileSwitcher.profileRouteStreamHandles = "1 1 1 2 2 2"
*.profileSwitcher.activateGclProfile = true
*.profileSwitcher.profileEgressInterfaces = "s0.eth[0] sA.eth[0] sD.eth[2] s0.eth[1] sB.eth[0]"
*.profileSwitcher.cycleTime = 1ms
*.profileSwitcher.ttWindow = 150us
*.profileSwitcher.ttPacketBytes = 200
*.profileSwitcher.frameOverheadBytes = 64
*.profileSwitcher.linkBitrate = 1Gbps
*.profileSwitcher.ttTrafficClass = 1
*.profileSwitcher.beTrafficClass = 0
