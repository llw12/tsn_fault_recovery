[General]
network = tsn_fault_recovery.networks.SmtScalabilityBenchmarkNetwork
sim-time-limit = 0s
cmdenv-express-mode = true
record-eventlog = false
**.scalar-recording = false
**.vector-recording = false

*.benchmark.scenario = readJSON("scenario.json")
*.benchmark.portMap = readJSON("port_map.json")
*.benchmark.caseId = "UNSET"
*.benchmark.solverMode = "PRODUCTION_OPTIMIZE"
*.benchmark.solverTimeoutMs = 30000
*.benchmark.reportOutputPath = "solver_report.json"
