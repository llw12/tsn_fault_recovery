[General]

network = tsn_fault_recovery.networks.DiamondTsnNetwork
sim-time-limit = 20ms


# ==========================================================
# 1. Ethernet
# ==========================================================

*.*.eth[*].bitrate = 100Mbps


# ==========================================================
# 2. Source applications
# ==========================================================

*.source.numApps = 2
*.source.app[*].typename = "UdpSourceApp"

# ---------- TT / high-priority stream ----------

*.source.app[0].display-name = "TT"
*.source.app[0].io.destAddress = "destination"
*.source.app[0].io.destPort = 1000
*.source.app[0].source.packetLength = 200B
*.source.app[0].source.productionInterval = 1ms

# ---------- Best-effort stream ----------

*.source.app[1].display-name = "BE"
*.source.app[1].io.destAddress = "destination"
*.source.app[1].io.destPort = 1001
*.source.app[1].source.packetLength = 1400B
*.source.app[1].source.productionInterval = 200us

*.source.app[0].io.displayStringTextFormat = "{numSent} TT"
*.source.app[1].io.displayStringTextFormat = "{numSent} BE"

# ==========================================================
# 3. Destination applications
# ==========================================================

*.destination.numApps = 2
*.destination.app[*].typename = "UdpSinkApp"

*.destination.app[0].display-name = "TT"
*.destination.app[0].io.localPort = 1000

*.destination.app[1].display-name = "BE"
*.destination.app[1].io.localPort = 1001

*.destination.app[0].io.displayStringTextFormat = "{numReceived} TT"
*.destination.app[1].io.displayStringTextFormat = "{numReceived} BE"


# ==========================================================
# 4. Enable outgoing streams
# ==========================================================

*.source.hasOutgoingStreams = true


# ==========================================================
# 5. Stream identification
# ==========================================================

*.source.bridging.streamIdentifier.identifier.mapping = [{stream: "TT", packetFilter: expr(udp.destPort == 1000)}, {stream: "BE", packetFilter: expr(udp.destPort == 1001)}]


# ==========================================================
# 6. Stream encoding / PCP
# ==========================================================

*.source.bridging.streamCoder.encoder.mapping = [{stream: "TT", pcp: 4}, {stream: "BE", pcp: 0}]


# ==========================================================
# 7. Enable TAS
# ==========================================================

*.s*.hasEgressTrafficShaping = true

*.s*.bridging.directionReverser.reverser.excludeEncapsulationProtocols = ["ieee8021qctag"]


# ==========================================================
# 8. Two traffic classes
# ==========================================================

*.s*.eth[*].macLayer.queue.numTrafficClasses = 2

*.s*.eth[*].macLayer.queue.*[0].display-name = "BE"
*.s*.eth[*].macLayer.queue.*[1].display-name = "TT"


# ==========================================================
# 9. Gate Control List
#
# Cycle = 1 ms
#
# 0 - 100 us:
#     TT open
#     BE closed
#
# 100 - 1000 us:
#     TT closed
#     BE open
# ==========================================================

*.s*.eth[*].macLayer.queue.transmissionGate[0].initiallyOpen = false
*.s*.eth[*].macLayer.queue.transmissionGate[0].durations = [100us, 900us]

*.s*.eth[*].macLayer.queue.transmissionGate[1].initiallyOpen = true
*.s*.eth[*].macLayer.queue.transmissionGate[1].durations = [100us, 900us]


# ==========================================================
# 10. Visualization
# ==========================================================

*.visualizer.infoVisualizer.displayInfos = true
*.visualizer.infoVisualizer.placementHint = "top"
*.visualizer.infoVisualizer.modules = "*.*.app[*].io"

*.visualizer.networkNodeVisualizer.annotationSpacing = 12

*.visualizer.gateScheduleVisualizer.displayGateSchedules = true
*.visualizer.gateScheduleVisualizer.gateFilter = "**.s1.eth[1].**"
*.visualizer.gateScheduleVisualizer.width = 220
*.visualizer.gateScheduleVisualizer.height = 16
*.visualizer.gateScheduleVisualizer.placementHint = "top"