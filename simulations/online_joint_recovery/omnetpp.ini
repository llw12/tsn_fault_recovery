include ../baseline/omnetpp.ini

[Config OnlineJointRecovery]
description = "Fault-time BFS route computation plus deterministic route-derived GCL generation"

*.scenarioManager.script = xml("<scenario> <disconnect t='5ms' src-module='s1' dest-module='s2'/> </scenario>")

# The shared activator is invoked by the online controller, not by its own timer.
*.profileSwitcher.enabled = false

*.onlineJointRecoveryController.enabled = true
*.onlineJointRecoveryController.faultTime = 5ms
*.onlineJointRecoveryController.solverDelay = 1ms
*.onlineJointRecoveryController.detectionSchedulingPriority = 100
*.onlineJointRecoveryController.activationSchedulingPriority = -100
*.onlineJointRecoveryController.failedEndpointA = "s1"
*.onlineJointRecoveryController.failedEndpointB = "s2"
*.onlineJointRecoveryController.routeStart = "s1"
*.onlineJointRecoveryController.destination = "destination"
*.onlineJointRecoveryController.activatorModule = "profileSwitcher"
*.onlineJointRecoveryController.cycleTime = 1ms
*.onlineJointRecoveryController.ttWindow = 100us
*.onlineJointRecoveryController.ttPacketBytes = 200
*.onlineJointRecoveryController.frameOverheadBytes = 64
*.onlineJointRecoveryController.linkBitrate = 100Mbps
*.onlineJointRecoveryController.ttTrafficClass = 1
*.onlineJointRecoveryController.beTrafficClass = 0
