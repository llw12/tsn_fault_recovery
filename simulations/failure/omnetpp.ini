# Reuse the complete no-failure baseline configuration
include ../baseline/omnetpp.ini


[Config LinkFailure]

description = "S1-S2 link fails at t=5ms without deterministic recovery"

# Keep the simulation running long enough to observe the failure
sim-time-limit = 20ms

# At t = 5 ms, physically disconnect the bidirectional S1-S2 link
*.scenarioManager.script = xml("<scenario> <disconnect t='5ms' src-module='s1' dest-module='s2'/> </scenario>")