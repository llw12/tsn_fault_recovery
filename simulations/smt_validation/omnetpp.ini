include ../baseline/omnetpp.ini

[Config SmtUnitTests]
network = tsn_fault_recovery.networks.SmtScheduleUnitTestNetwork
sim-time-limit = 0s

[Config SmtSingleFlowCompatibility]
description = "Single TT flow scheduled by Z3 and activated through ProfileSwitcher"
sim-time-limit = 10ms

*.profileSwitcher.enabled = false
*.smtValidationController.enabled = true
*.smtValidationController.expectedStatus = "SAT"
*.smtValidationController.profileId = "smt-single-flow"
*.smtValidationController.activationTime = 0s
*.smtValidationController.routeSwitches = "s1 s2 s4"
*.smtValidationController.routeInterfaces = "eth1 eth1 eth2"
*.smtValidationController.routeEgressInterfaces = "s1.eth[1] s2.eth[1] s4.eth[2]"
*.smtValidationController.flowIds = "TT"
*.smtValidationController.flowSources = "source"
*.smtValidationController.flowDestinations = "destination"
*.smtValidationController.flowPacketBytes = "200"
*.smtValidationController.flowTrafficClasses = "1"
*.smtValidationController.flowPeriods = "1ms"
*.smtValidationController.flowDeadlines = "300us"
*.smtValidationController.flowReleaseOffsets = "0us"
*.smtValidationController.cycleTime = 1ms
*.smtValidationController.timeQuantum = 1us
*.smtValidationController.ingressMargin = 40us
*.smtValidationController.hopMargin = 5us

*.source.app[0].source.packetNameFormat = "TT-%c"
*.source.app[0].source.packetRepresentation = "applicationPacket"
*.packetIdentityRecorder.enabled = true
*.packetIdentityRecorder.flowIds = "TT"
*.packetIdentityRecorder.sourceModules = "source.app[0].io"
*.packetIdentityRecorder.destinationModules = "destination.app[0].io"

[Config SmtMultiFlowSat]
description = "Three contending 1ms TT flows with different sizes and deadlines"
sim-time-limit = 10ms

*.source.numApps = 4
*.source.app[*].typename = "UdpSourceApp"
*.source.app[0].display-name = "TT1"
*.source.app[0].io.destAddress = "destination"
*.source.app[0].io.destPort = 1101
*.source.app[0].source.packetLength = 200B
*.source.app[0].source.productionInterval = 1ms
*.source.app[0].source.initialProductionOffset = 0us
*.source.app[0].source.packetNameFormat = "TT1-%c"
*.source.app[0].source.packetRepresentation = "applicationPacket"
*.source.app[1].display-name = "TT2"
*.source.app[1].io.destAddress = "destination"
*.source.app[1].io.destPort = 1102
*.source.app[1].source.packetLength = 300B
*.source.app[1].source.productionInterval = 1ms
*.source.app[1].source.initialProductionOffset = 5us
*.source.app[1].source.packetNameFormat = "TT2-%c"
*.source.app[1].source.packetRepresentation = "applicationPacket"
*.source.app[2].display-name = "TT3"
*.source.app[2].io.destAddress = "destination"
*.source.app[2].io.destPort = 1103
*.source.app[2].source.packetLength = 400B
*.source.app[2].source.productionInterval = 1ms
*.source.app[2].source.initialProductionOffset = 10us
*.source.app[2].source.packetNameFormat = "TT3-%c"
*.source.app[2].source.packetRepresentation = "applicationPacket"
*.source.app[3].display-name = "BE"
*.source.app[3].io.destAddress = "destination"
*.source.app[3].io.destPort = 1001
*.source.app[3].source.packetLength = 1400B
*.source.app[3].source.productionInterval = 200us

*.destination.numApps = 4
*.destination.app[*].typename = "UdpSinkApp"
*.destination.app[0].display-name = "TT1"
*.destination.app[0].io.localPort = 1101
*.destination.app[1].display-name = "TT2"
*.destination.app[1].io.localPort = 1102
*.destination.app[2].display-name = "TT3"
*.destination.app[2].io.localPort = 1103
*.destination.app[3].display-name = "BE"
*.destination.app[3].io.localPort = 1001

*.source.bridging.streamIdentifier.identifier.mapping = [{stream: "TT1", packetFilter: expr(udp.destPort == 1101)}, {stream: "TT2", packetFilter: expr(udp.destPort == 1102)}, {stream: "TT3", packetFilter: expr(udp.destPort == 1103)}, {stream: "BE", packetFilter: expr(udp.destPort == 1001)}]
*.source.bridging.streamCoder.encoder.mapping = [{stream: "TT1", pcp: 4}, {stream: "TT2", pcp: 4}, {stream: "TT3", pcp: 4}, {stream: "BE", pcp: 0}]

*.profileSwitcher.enabled = false
*.smtValidationController.enabled = true
*.smtValidationController.expectedStatus = "SAT"
*.smtValidationController.profileId = "smt-three-flow"
*.smtValidationController.activationTime = 0s
*.smtValidationController.routeSwitches = "s1 s2 s4"
*.smtValidationController.routeInterfaces = "eth1 eth1 eth2"
*.smtValidationController.routeEgressInterfaces = "s1.eth[1] s2.eth[1] s4.eth[2]"
*.smtValidationController.flowIds = "TT1 TT2 TT3"
*.smtValidationController.flowSources = "source source source"
*.smtValidationController.flowDestinations = "destination destination destination"
*.smtValidationController.flowPacketBytes = "200 300 400"
*.smtValidationController.flowTrafficClasses = "1 1 1"
*.smtValidationController.flowPeriods = "1ms 1ms 1ms"
*.smtValidationController.flowDeadlines = "450us 500us 550us"
*.smtValidationController.flowReleaseOffsets = "0us 5us 10us"
*.smtValidationController.cycleTime = 1ms
*.smtValidationController.timeQuantum = 1us
*.smtValidationController.ingressMargin = 40us
*.smtValidationController.hopMargin = 5us

*.packetIdentityRecorder.enabled = true
*.packetIdentityRecorder.flowIds = "TT1 TT2 TT3"
*.packetIdentityRecorder.sourceModules = "source.app[0].io source.app[1].io source.app[2].io"
*.packetIdentityRecorder.destinationModules = "destination.app[0].io destination.app[1].io destination.app[2].io"

[Config SmtMultiFlowUnsat]
extends = SmtMultiFlowSat
description = "Same shared-link load with an impossible 50us TT1 deadline"
*.smtValidationController.expectedStatus = "UNSAT"
*.smtValidationController.flowDeadlines = "50us 500us 550us"
