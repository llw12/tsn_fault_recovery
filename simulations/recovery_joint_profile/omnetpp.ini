include ../baseline/omnetpp.ini

[Config JointProfileRecovery]
description = "S1-S2 fails at 5ms; activate the precomputed joint {T1,P1} profile at 6ms"

*.scenarioManager.script = xml("<scenario> <disconnect t='5ms' src-module='s1' dest-module='s2'/> </scenario>")

*.profileSwitcher.enabled = true
*.profileSwitcher.switchTime = 6ms
*.profileSwitcher.activationSchedulingPriority = -100
*.profileSwitcher.profileId = "manual-joint-T1-P1"

# Forwarding profile T1. The other backup-path entries remain valid and are
# included later by the online solver; only S1 changes relative to T0 here.
*.profileSwitcher.profileRouteSwitches = "s1"
*.profileSwitcher.profileRouteInterfaces = "eth2"
*.profileSwitcher.destinationPath = "destination"

# Scheduling profile P1, derived from actual NED connection order:
# s1.eth[2] -> s3, s3.eth[1] -> s4, s4.eth[2] -> destination.
*.profileSwitcher.activateGclProfile = true
*.profileSwitcher.profileEgressInterfaces = "s1.eth[2] s3.eth[1] s4.eth[2]"
*.profileSwitcher.cycleTime = 1ms
*.profileSwitcher.ttWindow = 100us
*.profileSwitcher.ttPacketBytes = 200
*.profileSwitcher.frameOverheadBytes = 64
*.profileSwitcher.linkBitrate = 100Mbps
*.profileSwitcher.ttTrafficClass = 1
*.profileSwitcher.beTrafficClass = 0
