# Reuse the complete baseline configuration
include ../baseline/omnetpp.ini


[Config ManualRecovery]

description = "S1-S2 fails at 5ms; precomputed backup profile switches S1 forwarding to S3 at 6ms"

sim-time-limit = 20ms


# ==========================================================
# 1. Failure injection
# ==========================================================

*.scenarioManager.script = xml("<scenario> <disconnect t='5ms' src-module='s1' dest-module='s2'/> </scenario>")


# ==========================================================
# 2. Enable precomputed recovery profile
# ==========================================================

*.profileSwitcher.enabled = true

*.profileSwitcher.switchTime = 6ms

*.profileSwitcher.switchPath = "s1"

*.profileSwitcher.destinationPath = "destination"

# eth[2] is S1 -> S3
*.profileSwitcher.backupInterface = "eth2"

# Keep the established routing-only ablation {T1,P0} unchanged.
*.profileSwitcher.activateGclProfile = false
