include ../baseline/omnetpp.ini

[Config OnlineSmtRecovery]
description = "BFS-based online rerouting plus Z3 SMT-based TAS rescheduling"

*.scenarioManager.script = xml("<scenario> <disconnect t='5ms' src-module='s1' dest-module='s2'/> </scenario>")
*.profileSwitcher.enabled = false
*.onlineJointRecoveryController.enabled = true
*.onlineJointRecoveryController.solverBackend = "z3"
*.onlineJointRecoveryController.faultTime = 5ms
*.onlineJointRecoveryController.solverDelay = 1ms
*.onlineJointRecoveryController.failedEndpointA = "s1"
*.onlineJointRecoveryController.failedEndpointB = "s2"
*.onlineJointRecoveryController.routeStart = "s1"
*.onlineJointRecoveryController.destination = "destination"
*.onlineJointRecoveryController.cycleTime = 1ms
*.onlineJointRecoveryController.timeQuantum = 1us
*.onlineJointRecoveryController.ingressMargin = 40us
*.onlineJointRecoveryController.hopMargin = 5us
*.onlineJointRecoveryController.frameOverheadBytes = 64
*.onlineJointRecoveryController.linkBitrate = 100Mbps
*.onlineJointRecoveryController.ttTrafficClass = 1
*.onlineJointRecoveryController.beTrafficClass = 0

*.source.app[0].source.packetNameFormat = "TT-%c"
*.source.app[0].source.packetRepresentation = "applicationPacket"
*.packetIdentityRecorder.enabled = true
*.packetIdentityRecorder.flowIds = "TT"
*.packetIdentityRecorder.sourceModules = "source.app[0].io"
*.packetIdentityRecorder.destinationModules = "destination.app[0].io"

[Config OnlineSmtDelay01]
extends = OnlineSmtRecovery
*.onlineJointRecoveryController.solverDelay = 0.1ms

[Config OnlineSmtDelay1]
extends = OnlineSmtRecovery
*.onlineJointRecoveryController.solverDelay = 1ms

[Config OnlineSmtDelay5]
extends = OnlineSmtRecovery
*.onlineJointRecoveryController.solverDelay = 5ms

[Config OnlineSmtDelay10]
extends = OnlineSmtRecovery
*.onlineJointRecoveryController.solverDelay = 10ms
